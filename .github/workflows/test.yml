name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  test:
    name: web and api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        run: corepack enable && corepack install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        run: pnpm test:web

      - name: Run API tests
        run: pnpm test:api
